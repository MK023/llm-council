# CI workflow — defensive: no use of untrusted event payloads in run: commands.
# Only safe inputs: matrix.python-version (controlled by this file) and static strings.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No push from CI: leaving the token in .git/config only widens the blast radius
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify no external runtime dependencies (stdlib-only)
        run: |
          test ! -f requirements.txt || (echo "requirements.txt found — project should remain stdlib-only" && exit 1)

      - name: Run unit tests
        run: python -m unittest discover tests/ -v

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No push from CI: leaving the token in .git/config only widens the blast radius
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.15.9

      - name: Ruff check
        run: ruff check council/ tests/

      - name: Ruff format check
        run: ruff format --check council/ tests/

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No push from CI: leaving the token in .git/config only widens the blast radius
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install coverage
        run: pip install coverage==7.13.4

      - name: Run tests under coverage
        run: python -m coverage run -m unittest discover tests/

      # Global floor (58%, see pyproject): stops untested code from entering.
      # It is NOT a quality claim — that is what mutation testing measures.
      - name: Coverage floor (global)
        run: python -m coverage report

      # Critical modules carry the privacy posture and the protocol itself, so they
      # answer to a higher bar than the repo average. __main__.py (CLI orchestration,
      # 21%) is the declared debt and is deliberately outside this gate.
      - name: Coverage floor (critical modules)
        run: python -m coverage report --include="council/client.py,council/config.py,council/stages.py" --fail-under=90

  workflow-lint:
    name: Workflow lint (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install zizmor
        run: pip install zizmor==1.25.0

      # Pinning actions to SHAs only lasts if something checks that they stay pinned:
      # a mutable tag can be reintroduced in any future PR without anyone noticing.
      - name: Audit workflows
        run: zizmor .github/workflows/
