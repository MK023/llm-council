# E2E settimanale contro l'API vera. È l'unico test che tocca la rete.
#
# PERCHÉ ESISTE: la suite unitaria non può accorgersi che un modello ha smesso di
# rispondere. È già successo due volte — DeepSeek a maggio, Qwen a luglio — e in
# entrambi i casi il difetto è emerso ESEGUENDO, mesi dopo, non dai test.
# Questo job è la sentinella che quei due mesi non li fa ripetere.
#
# SICUREZZA: mai su `pull_request`. Il repo è pubblico e i secret non arrivano
# alle PR da fork; peggio, un workflow modificato in una PR potrebbe esfiltrare
# la chiave. Solo cron e avvio manuale, entrambi sul ramo principale.
name: E2E settimanale

on:
  schedule:
    # Lunedì 06:00 UTC. Un fallimento resta visibile tutta la settimana.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  live-run:
    name: Council contro l'API vera
    runs-on: ubuntu-latest
    # Il job non ne aveva NESSUNO, quindi ereditava il default di GitHub: sei ore.
    #
    # Serve perche' le attese da rate limit sono per-tentativo: un provider che risponde
    # sempre 429 con un `Retry-After` alto porta una run da ~3 minuti a 7, e ogni seggio e'
    # servito da un provider solo (`allow_fallbacks: false`, la garanzia ZDR). Un tetto in
    # codice sul totale delle attese sarebbe una seconda contabilita' destinata a divergere;
    # questo limita OGNI modo di restare appesi, compresi quelli non ancora immaginati.
    #
    # 15 e non 30: sopra i 15 il monitor Sentry — `max_runtime: 30` piu' in basso — non
    # aggiunge niente che questo non dica prima.
    timeout-minutes: 15
    permissions:
      contents: read
    # Il cron gira solo sul repo di origine, mai sui fork che clonano il progetto.
    if: github.repository == 'MK023/llm-council'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Domanda in ITALIANO e lunga, di proposito: è la forma che ha fatto cadere
      # due voter diversi. Un prompt corto in inglese non riprodurrebbe il difetto.
      - name: Esegui il council
        id: council
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          QUESTION: >-
            Valuta in modo argomentato questo compromesso di ingegneria del software:
            conviene introdurre un livello di astrazione in più per rendere un
            componente sostituibile, oppure accettare l'accoppiamento e rimandare
            l'astrazione al momento in cui serve davvero una seconda implementazione?
            Considera manutenibilità, costo cognitivo e rischio di astrazione
            prematura, e concludi con una raccomandazione pratica.
        run: |
          set +e
          # stderr su file E a video: lo step dopo ne ha bisogno per sapere quale sessione
          # cercare su Langfuse e quante chiamate sono davvero partite. Redirezione semplice
          # e `cat` dopo, non `tee` in process substitution: quella lascia un sottoprocesso
          # che puo' non aver ancora scaricato il buffer quando lo step successivo legge.
          python -m council "$QUESTION" 2>council.stderr
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat council.stderr >&2

      # Il contratto d'uscita è il test. 3 = degradato: la risposta esiste ma un
      # votante è caduto, ed è ESATTAMENTE il caso che questo job deve scoprire.
      # Passare un 3 in silenzio significherebbe riaprire il buco che ha nascosto
      # il bug del reasoning per due mesi.
      - name: Verifica il contratto d'uscita
        env:
          CODE: ${{ steps.council.outputs.exit_code }}
        run: |
          case "$CODE" in
            0) echo "Council completo: 3 votanti su 3." ;;
            3) echo "::error::Run DEGRADATA: un votante non ha risposto o il ranking non è parsabile. Controlla ERROR SUMMARY sopra — di solito è un modello che ha iniziato a rifiutare o a esaurire i token ragionando." ; exit 1 ;;
            2) echo "::error::Configurazione: chiave assente o invalida." ; exit 1 ;;
            4) echo "::error::Tetto token superato." ; exit 1 ;;
            *) echo "::error::Uno stadio è fallito del tutto (exit $CODE)." ; exit 1 ;;
          esac

      # L'ingestione verso Langfuse NON parte da questo codice: passa da OpenRouter
      # Broadcast, una spunta nell'account. Nessun test puo' raggiungere una casella nel
      # cruscotto di qualcun altro, quindi fino al 2026-08-31 quel pezzo non era misurato da
      # niente — funzionava, ma per fortuna e non per prova.
      #
      # `if: always()` perche' vale anche su una run degradata: e' proprio quando qualcosa
      # e' andato storto che serve sapere se la traccia e' arrivata. Lo script esce SEMPRE 0
      # e non puo' cambiare il verdetto dello step sopra.
      - name: Le tracce sono arrivate a Langfuse?
        if: always()
        # Tetto proprio, oltre a quello del job: questo step dorme aspettando l'ingestione
        # e pagina. Se restasse appeso, il rosso finirebbe sul council invece che qui.
        timeout-minutes: 5
        env:
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
        run: python scripts/langfuse_check.py council.stderr

      # Check-in del cron monitor Sentry (slug: llm-council-e2e).
      #
      # ATTENZIONE, misurato il 2026-08-31: quel monitor e' `disabled` e non ha MAI
      # registrato un check-in. Piano gratuito, un monitor attivo per account, posto
      # occupato da un altro progetto. Questo step spedisce e Sentry butta: nella fascia
      # oraria in cui la E2E ha girato oggi, `ok=0 error=0 missed=0`. Tutto il ragionamento
      # qui sotto descrive quindi un guardiano CHE NON GIRA — resta perche' e' giusto e
      # perche' il giorno che il posto si libera funziona da solo, ma finche' questa riga
      # e' qui il caso "non e' partita affatto" NON e' sorvegliato da nessuno.
      #
      # Il job rosso su Actions segnala che la sentinella e' FALLITA. Nessuno pero'
      # si accorge se non parte affatto — e GitHub disabilita gli schedule dopo 60
      # giorni di inattivita' sul repo, in silenzio. Un cron monitor si allarma
      # sull'ASSENZA del check-in, che e' l'unico modo di vedere quel caso.
      #
      # `monitor_config` fa l'upsert: il monitor nasce da solo al primo check-in, e
      # la sua schedule sta qui accanto a quella vera sopra — se un giorno cambia il
      # cron si cambiano insieme, o Sentry grida "missed" ogni settimana.
      #
      # L'URL completo (progetto + chiave + slug) sta in un secret, non nel file:
      # il repo e' pubblico e un URL di check-in leggibile da chiunque permette di
      # spedire uno stato `ok` falso, che maschererebbe proprio la run mancata che
      # questo monitor esiste per vedere.
      #
      # `exit 0` finale NON e' pigrizia: questo step sorveglia la sentinella, non e'
      # la sentinella. Se Sentry e' giu' o il secret manca, il verdetto sul council
      # resta quello dello step sopra — un guardiano che uccide cio' che sorveglia
      # e' peggio di nessun guardiano.
      - name: Check-in Sentry (la sentinella e' viva)
        if: always()
        env:
          ESITO: ${{ job.status }}
          CHECKIN_URL: ${{ secrets.SENTRY_CRON_CHECKIN_URL }}
        run: |
          if [ -z "$CHECKIN_URL" ]; then
            echo "::warning::SENTRY_CRON_CHECKIN_URL assente — check-in saltato"
            exit 0
          fi
          stato=ok
          [ "$ESITO" = "success" ] || stato=error
          curl -sS -m 10 -X POST "$CHECKIN_URL" \
            -H 'Content-Type: application/json' \
            -d "{\"monitor_config\":{\"schedule\":{\"type\":\"crontab\",\"value\":\"0 6 * * 1\"},\"timezone\":\"UTC\",\"checkin_margin\":60,\"max_runtime\":30},\"status\":\"$stato\"}" \
            && echo "check-in Sentry: $stato" \
            || echo "check-in Sentry non riuscito — il verdetto sul council resta valido"
          exit 0
