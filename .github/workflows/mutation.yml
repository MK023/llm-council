# Mutation testing — the gate that asks whether the assertions are worth anything.
#
# Coverage on this repo is 100%, which says every line runs during the suite. It
# does not say a single assertion would notice if that line changed. Mutation
# testing breaks the code on purpose and fails when the tests stay green.
#
# Off the PR path on purpose (testing-pyramid: slow gates go nightly, never in the
# loop a developer waits on). Weekly rather than nightly because the commit rate
# here is bursty: a nightly run on an unchanged tree measures the same number over
# and over. Thursday, so a red mutation run and a red Monday E2E never arrive on
# the same morning looking like one incident.
name: Mutation testing

on:
  schedule:
    - cron: "0 3 * * 4"
  workflow_dispatch:
    inputs:
      threshold:
        description: "Mutation score floor for this run (blank = the declared floor)"
        required: false
        type: string

permissions: {}

env:
  # The declared floor. One number, one place — the gate reads it, the README
  # quotes it, and raising it is a one-line PR with the score to justify it.
  #
  # 85 because that is what the code measures today: 488 mutants killed out of 568,
  # 85.9%. Not a target picked from an article — a floor set under the measurement, so
  # the number can only be defended upward. Just under a point of slack on purpose: a
  # floor equal to the current score turns the next unlucky mutant into a red build for
  # no reason.
  #
  # It opened at 55 on 2026-08-13, on 315 kills, then 80. Every mutant that died between
  # those runs died to an assertion, not to a change in `council/` — the tests were
  # checking that a line ran, not what it produced. Raised only after the measurement.
  #
  # `stages.py` is now at 1 survivor out of 138. What is left lives in the diagnostic
  # message strings of `client._validate_response` and in the prose of the prompts, plus
  # four EQUIVALENT mutants in `observability.py` (tabled at the top of
  # tests/test_observability.py) that no assertion can kill. A floor near 90 would be
  # bought with assertions on the exact wording of error messages, which is a gate on
  # prose, not on behaviour. This is roughly where the honest ceiling sits.
  MUTATION_FLOOR: "85"

jobs:
  mutmut:
    name: Mutation score
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # mutmut forks one child per core and re-runs the suite for every mutant. It
    # should finish well inside this; the cap is here so a pathological hang costs
    # an hour of a free runner instead of six.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 3.14 since 2026-09-04, and the reason is reproducibility rather than novelty.
      # CLAUDE.md's standing instruction for this gate is "reproduce CI faithfully in a
      # throwaway venv" — after a green local run at 88.1% failed to predict a CI abort
      # on 2026-09-01. That instruction became impossible when the development machine
      # moved to Ubuntu 26.04, whose only apt-installable interpreter is 3.14: the
      # version a human can actually run and the version the gate runs on had drifted
      # apart, which is exactly the drift that cost two wrong fixes. Measured on 3.14
      # with the pinned mutmut 3.7.0 + pytest 9.1.1 before the change: 697 mutants,
      # 614 killed, 88.1% against the floor of 85.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install mutation tools
        run: pip install --require-hashes -r requirements-mutation.txt

      # Exits 0 whether mutants survive or not — this step is the measurement,
      # never the verdict. The verdict is the gate step below.
      - name: Run mutmut
        run: mutmut run

      - name: Export stats
        run: mutmut export-cicd-stats

      # A scheduled job that fails without evidence costs a week, because that is
      # how long until the next one. The surviving mutants go in the run summary,
      # so a red build is readable without re-running anything locally.
      - name: Surviving mutants to the job summary
        if: always()
        run: |
          mutmut results > survivors.txt || echo '(mutmut results produced nothing)' > survivors.txt
          # Also to the log: the summary is not fetchable through the API, so a
          # summary-only report is readable in the browser and nowhere else.
          cat survivors.txt
          {
            echo '## Mutants left alive'
            echo
            echo '```'
            cat survivors.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The names alone say WHERE a mutant lives, never WHAT it changed. The reason
      # given here used to be *"mutmut cannot run on an Apple x86_64 (libcst ships no
      # wheel), so nobody can ask it locally"* — false twice over: it was already
      # false on that laptop under 3.12.7, and the machine is Ubuntu 26.04 x86_64
      # since 2026-09-04, where the whole pinned set installs on 3.14. The step stays
      # because the reason survives the correction: without the diff, the only way to
      # write the assertion that kills a survivor is to guess which of the ~20
      # mutations of that function this one is, and a scheduled job is a week away
      # from being asked again. The evidence costs seconds here and saves that week.
      - name: The surviving diffs, not just their names
        if: always()
        run: |
          # Match on "not whitespace", never on an alphabet. mutmut names the mutants of
          # CLASS METHODS with a U+01C1 separator (council.client.xǁOpenRouterClientǁcall),
          # so an [A-Za-z0-9_.] class silently truncates them to a name `mutmut show`
          # cannot resolve — and the methods are where most survivors live. The same
          # shape of bug as the wheel filter in scripts/pin_dev_deps.py: a pattern that
          # reads correctly, matches the wrong thing, and reports nothing rather than failing.
          grep -oE '[^[:space:]]+__mutmut_[0-9]+' survivors.txt | sort -u > names.txt || true
          : > mutation-survivor-diffs.txt
          while read -r name; do
            {
              echo "=== $name ==="
              mutmut show "$name" 2>&1 || echo '(mutmut show produced nothing)'
              echo
            } >> mutation-survivor-diffs.txt
          done < names.txt
          cat mutation-survivor-diffs.txt

      - name: Keep the raw stats
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-stats
          path: |
            mutants/mutmut-cicd-stats.json
            mutation-survivor-diffs.txt
          if-no-files-found: warn

      # The gate. Fails on a score below the floor, and equally on the two ways a
      # mutation run reports nothing while looking successful: zero mutants tried,
      # or a run cut short. See tests/test_mutation_gate.py.
      #
      # The dispatch input goes through env and is quoted, never interpolated into
      # the shell: workflow_dispatch inputs are attacker-shaped by habit even when
      # only a maintainer can set them.
      - name: Mutation gate
        env:
          FLOOR: ${{ inputs.threshold || env.MUTATION_FLOOR }}
        run: python scripts/mutation_gate.py mutants/mutmut-cicd-stats.json "$FLOOR"
