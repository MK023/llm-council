[project]
name = "llm-council"
version = "0.3.0"
description = "Multi-model anti-sycophancy verification council via OpenRouter (stdlib-only)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Marco Bellingeri" }]
keywords = ["llm", "council", "openrouter", "anti-sycophancy", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

# No runtime dependencies — stdlib-only by design (`urllib` for HTTP, `unittest` for tests)

# Mutation testing. Coverage is a floor; this is the metric that asks whether the
# assertions on the covered lines are worth anything. Runs weekly, never on the PR
# path — see .github/workflows/mutation.yml for the schedule and the threshold.
[tool.mutmut]
# The three modules the test contract already calls critical: the HTTP client with
# the ZDR posture and the retry policy, the config that builds the fenced prompts,
# and the protocol itself. Measured 2026-08-13 over ALL of council/: 47.5%, with
# ~70% of the survivors inside __main__.py — string mutations on human-readable
# report output, which no sensible assertion would catch. Gating on that number
# would have buried the signal in the printing layer. __main__.py keeps its
# coverage floor and Sonar; what it does not get is a mutation gate, on purpose.
source_paths = ["council/client.py", "council/config.py", "council/stages.py"]
# The whole suite MINUS the four files that never import `council`: they cannot
# kill one of its mutants, so including them only adds runtime and drags their
# filesystem assumptions into the tree mutmut copies. Ignoring by name rather than
# listing what to run means a new test file joins the mutation run automatically —
# a list of includes would silently leave it out.
pytest_add_cli_args_test_selection = [
    "tests/",
    "--ignore=tests/test_packaging.py",
    "--ignore=tests/test_security_doc.py",
    "--ignore=tests/test_mutation_gate.py",
    "--ignore=tests/test_pin_dev_deps.py",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]  # test method names may be longer than 80 chars

[tool.ruff.format]
quote-style = "double"

# Coverage — misurata per la prima volta il 2026-07-26: era al 50%, con il cuore del
# protocollo (stages.py) al 40% e il client HTTP al 93%. Si testava ciò che era facile
# da mockare. La soglia è un PAVIMENTO, non un obiettivo: serve a impedire che entri
# codice non testato, non a certificare qualità — quella la misura il mutation testing.
[tool.coverage.run]
source = ["council"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
# 100%, righe e branch. Non e' un traguardo inseguito per il numero: le 17 righe
# che mancavano al 94% erano comportamenti veri e non testati — lo stage 2 che
# fallisce del tutto, il SECONDO controllo del tetto token, e soprattutto
# `_label_responses`, cioe' la difesa da prompt injection che SECURITY.md dichiara
# a nome del progetto e che nessuno aveva mai esercitato.
#
# Su ~400 statement e ~90 branch il 100% e' difendibile: il codice e' piccolo e non
# ha rami irraggiungibili. Su una base grande sarebbe un'altra conversazione, e la
# regola tornerebbe a essere "clean as you code" sul solo codice nuovo.
# Resta un PAVIMENTO: la coverage dice quali righe girano, non se le asserzioni
# valgono qualcosa. Quello lo dice il mutation testing, che si fa a mano su ogni PR.
fail_under = 100
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
