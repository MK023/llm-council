[project]
name = "llm-council"
version = "0.3.0"
description = "Multi-model anti-sycophancy verification council via OpenRouter (stdlib-only)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Marco Bellingeri" }]
keywords = ["llm", "council", "openrouter", "anti-sycophancy", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

# No runtime dependencies — stdlib-only by design (`urllib` for HTTP, `unittest` for tests)

# Mutation testing. Coverage is a floor; this is the metric that asks whether the
# assertions on the covered lines are worth anything. Runs weekly, never on the PR
# path — see .github/workflows/mutation.yml for the schedule and the threshold.
[tool.mutmut]
source_paths = ["council/"]
# __main__.py is copied but not mutated. Measured 2026-08-13 over all of council/:
# 47.5%, and ~70% of the survivors lived in this one file — mutmut rewrites every
# string literal three ways (XX-wrapped, lowercased, uppercased), and __main__.py
# is the presentation layer: report headers, error summaries, help text. Nothing a
# sensible assertion would catch, and gating on that number buries the signal from
# the protocol underneath the printing.
#
# It keeps the 100% coverage floor and the Sonar gate; what it does not get is a
# mutation gate. `observability.py` stays IN: its output is the telemetry-privacy
# claim ("never the question or the answers"), which is worth mutating.
#
# The exclusion is only defensible while that file is ONLY presentation, and on
# 2026-08-14 it stopped being so: `_is_truncated` and `_collect_failures` decide the
# exit code, which is the contract the scheduled run reads. Decision logic inside an
# unmutated file is exactly the hole this gate exists to close, so the two functions
# MOVED to `council/stages.py` rather than the threshold being renegotiated. If it
# happens again, move the code — do not widen the exclusion.
#
# Narrowing `source_paths` to single files instead would break the run — mutmut
# copies only what it walks, so `council/__main__.py` would vanish from the tree
# and every test importing it would fail to collect. `do_not_mutate` copies.
do_not_mutate = ["council/__main__.py"]
# The whole suite MINUS the files that cannot kill a `council/` mutant: they only add
# runtime and drag their filesystem assumptions into the tree mutmut copies. Ignoring by
# name rather than listing what to run means a new test file joins the mutation run
# automatically — a list of includes would silently leave it out.
#
# The criterion used to be written as "files that never import `council`", which was a
# proxy and stopped being true on 2026-08-14: `test_probe_models.py` imports `CallResult`
# to build a fixture while testing `scripts/probe_models.py`. It still cannot kill a
# `council/` mutant — and worse, it BROKE THE WHOLE GATE: mutmut copies `council/` and
# the tests into `mutants/`, not `scripts/`, so collection died on
# `ModuleNotFoundError: No module named 'scripts'` and no mutant was ever tried. A gate
# that fails to collect reports nothing while looking busy, which is why
# `scripts/mutation_gate.py` also fails on a run that tried zero mutants.
pytest_add_cli_args_test_selection = [
    "tests/",
    "--ignore=tests/test_packaging.py",
    "--ignore=tests/test_security_doc.py",
    "--ignore=tests/test_mutation_gate.py",
    "--ignore=tests/test_pin_dev_deps.py",
    "--ignore=tests/test_probe_models.py",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]  # test method names may be longer than 80 chars

[tool.ruff.format]
quote-style = "double"

# Coverage — misurata per la prima volta il 2026-07-26: era al 50%, con il cuore del
# protocollo (stages.py) al 40% e il client HTTP al 93%. Si testava ciò che era facile
# da mockare. La soglia è un PAVIMENTO, non un obiettivo: serve a impedire che entri
# codice non testato, non a certificare qualità — quella la misura il mutation testing.
[tool.coverage.run]
source = ["council"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
# 100%, righe e branch. Non e' un traguardo inseguito per il numero: le 17 righe
# che mancavano al 94% erano comportamenti veri e non testati — lo stage 2 che
# fallisce del tutto, il SECONDO controllo del tetto token, e soprattutto
# `_label_responses`, cioe' la difesa da prompt injection che SECURITY.md dichiara
# a nome del progetto e che nessuno aveva mai esercitato.
#
# Su ~400 statement e ~90 branch il 100% e' difendibile: il codice e' piccolo e non
# ha rami irraggiungibili. Su una base grande sarebbe un'altra conversazione, e la
# regola tornerebbe a essere "clean as you code" sul solo codice nuovo.
# Resta un PAVIMENTO: la coverage dice quali righe girano, non se le asserzioni
# valgono qualcosa. Quello lo dice il mutation testing, che si fa a mano su ogni PR.
fail_under = 100
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
