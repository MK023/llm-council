# SonarQube Cloud — organizzazione mk023, regione EU.
#
# `sonar.host.url` NON si imposta: gli scanner recenti puntano da soli alla
# regione dell'organizzazione, e metterlo a mano è un modo per sbagliare.
# (Stessa configurazione del sito, dove la lezione è già stata pagata.)
sonar.projectKey=MK023_llm-council
sonar.organization=mk023

sonar.sources=council
sonar.tests=tests

sonar.sourceEncoding=UTF-8
# Il progetto dichiara requires-python >=3.10 e la CI testa 3.10/3.11/3.12.
# Senza questa riga l'analisi vale per "tutte le Python 3", cioè per nessuna.
sonar.python.version=3.10,3.11,3.12

# Coverage prodotta dal job `sonar` con `coverage xml` (formato Cobertura).
# È la stessa misura dei gate locali: una sola fonte, nessuna seconda verità.
sonar.python.coverage.reportPaths=coverage.xml

# `council` è sorgente, `tests` sono test: un file indicizzato in entrambi fa
# fallire l'analisi. Il resto non è codice di nessuno.
sonar.exclusions=**/__pycache__/**,**/.venv/**,htmlcov/**

# S6539 / regole pytest: Sonar suggerisce la fixture `monkeypatch` per le modifiche
# temporanee allo stato globale. Il progetto NON usa pytest — usa `unittest` della
# stdlib, coerentemente con la scelta zero-dipendenze che e' il tratto distintivo
# del repo. L'equivalente corretto qui e' `unittest.mock.patch.dict`, che infatti
# e' usato ovunque nei test nuovi. Adottare pytest per silenziare una regola
# significherebbe aggiungere una dipendenza per compiacere uno scanner.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S6539
sonar.issue.ignore.multicriteria.e1.resourceKey=tests/**/*.py

# Project version: senza, il quality gate non ha una linea di riferimento e la
# metrica "new code" resta vuota. Allineata a pyproject.toml.
sonar.projectVersion=0.3.0
